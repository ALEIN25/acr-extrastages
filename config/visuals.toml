# Interim visuals (stage-build --visuals, build.ps1 -Version v1.1+): render-only geometry written into a
# ProceduralMeshComponent of the forward gameplay cell. See docs/decisions.md D6 (v1.1, v1.2) and D7 (v1.3 objects).

[visuals]
chunk_mode = "off"

[road]
# DR2 ground codes drawn with the road material; all other DR2 collision is drawn as terrain
surfaces = ["GD0+", "CATG"]

[markers]
spacing_m = 0           # edge posts along both gate edges every spacing_m (0 = none: an early driving guide, DR2's own roadside objects are drawn now)
post_width_m = 0.3
post_height_m = 1.2
gate_height_m = 0       # start / finish gate posts and banner of our own (0 = none: DR2's start / finish structures are drawn, [objects] overhead_templates)

[materials]
# "" = engine default material (lit world grid; shows the terrain shape). The MI_* are the game's own physical-surface
# debug materials (unlit flat colours, parent M_PhysicalSurface).
terrain = ""
road = "/Game/Data/Gameplay/PhysicalMaterials/MI_SurfaceGravelFine"
posts = "/Game/Data/Gameplay/PhysicalMaterials/MI_WallMetalPole"
gates = "/Game/Data/Gameplay/PhysicalMaterials/MI_SurfaceGrass"

[objects]
precise_colliders = 1
precise_cell_m = 0.5
precise_band_m = 2.5
precise_max_boxes = 24
enclosed_interior = 1
enclosed_min_coverage = 0.7   # share of a fitted box outline (at two of five heights 0.5-2.5 m) that the object's own drawn surfaces must cover or shield before its stand-in is dropped (cars: wheel arches, porches); InvisibleCheck still checks independently
fit_colliders_to_mesh = 1
overhead_templates = "startfinish|lazerstart|lazerfinish|brand_arch"   # regex: start / finish arches and timing gantries that span the road by design: drawn with their DR2 mesh, minus the triangles inside the road corridor at car height
overhead_passable_above_m = 2.0   # overhead structures: their colliders over the road whose lowest point is this high above the centreline are left out (the car can fly into DR2's boxy arch colliders over crests; drawn and passable is never an invisible obstacle)
fit_colliders_max_cm = 100
# only used when stage-build also gets --objects (v1.3): the solid DR2 objects (the colliders written to BakedData)
enabled = 1
max_mesh_triangles = 20000      # per instance (v1.12: was 4000, which drew parked cars, campers and vans as boxes); heavier render meshes
                                # (the start gantry, scaffolding banners) are drawn as their collider shapes instead
prism_sides = 6                 # capsule colliders (tree trunks) drawn as n-sided prisms
max_total_triangles = 3000000   # offline check budget for the whole visuals mesh
tree_shape_classes = ["sSolidTreeLeafy", "sSolidPalmShortTree"]
trunk_draw_height_m = 3.5        # round 1: near-vertical tree trunk prisms (and proxy:trunks hulls) are drawn up to this far above the tree base only
                                #   (the 20-26 m collider columns stood up out of the crowns); the colliders stay whole. 0 = whole
# v1.4: nothing non-solid is drawn (v1.3 drew ~8,800 bush/fern/flax/grass clumps as 9-17 m octahedra). The only
# non-solid geometry left is the optional tree crowns (stage-build --visuals-vegetation crowns / build.ps1 -Vegetation; the
# additive build and the launcher draw them, textured per [object_textures] soft).
# v1.9: DR2 objects without a collider of their own are drawn from their render mesh after all (armco, walls, rock banks,
# fences, signs, houses): DR2 often puts their collision into the ground mesh (track.jpk, e.g. RBK+ rock banks), so left
# out they were solid but invisible beside the road (Argentina 01 r3 in game: arg_ral_wal_*, 2026-11-01). Template
# names matching not_solid_skip (case-insensitive regex: plants, light breakables, cloth) stay undrawn; plants with a
# billboard get their cards as before. Flags, blades, banners and cloth stay out: their alpha-cut shapes would draw as boards.
not_solid_skip = "grass|fern|flax|bush|shrub|plant|flower|weed|reed|ivy|moss|leaf|leaves|tree|palm|spectator|flag|blade|banner|bunting|cloth|tape|decal"
not_solid_max_triangles = 20000  # per instance for those (marshal cars, recovery vans, the ambulance: 5-15k triangles)
road_overlap_tolerance_m = 0.2  # a solid render mesh may reach max_penetration_m + this into the road corridor
                                # (over road surface, from car_height_min_m up to overhang_height_m); deeper -> shapes
overhang_height_m = 6
max_object_extent_m = 80        # offline check: largest drawn object (plan); NZ buildings are ~27 m, Poland's pol_big_barn 51 m, Greece's gre_stone_wall8 67 m (extent vs DR2 bounds is checked below)
max_extent_over_bounds = 1.15   # offline check: drawn plan extent / DR2 render-bounds plan extent (+ 1 m)
crown_max_radius_m = 2.5        # crowns mode: octahedron radius <= min(this, 0.5 x smaller crown plan extent)
crown_radius_factor = 0.5       #   x half the smaller plan extent of the DR2 crown bounds
crown_bottom_fraction = 0.6     #   crown spans this fraction of the tree height .. the top
crown_min_bottom_m = 3          #   crowns lower than this above the tree base are not drawn
crown_road_margin_m = 1.5       #   plan clearance kept from the road edges; a crown is shrunk to fit or dropped
crown_min_radius_m = 0.6
cards_parallel_margin_m = 0.3   # a plant too close for crossed cards gets one card along the road, ends this far off it
cards_max_radius_m = 12        # cards mode (trees, bushes as DR2 billboard cards, square like the billboard's views):
                                #   half-width = min(this, half the plant's height), road margin and minimum as for crowns
# DR2 tree canopies are inverted cone colliders (wide end up, ~3 m radius, apex ~1.5 m above the ground); drawn whole
# they are the large orange panels seen in v1.4. The colliders are kept as DR2 has them either way.
canopies = "clip"               # clip: draw only the part below canopy_clip_height_m above the tree base | full | none
canopy_clip_height_m = 2.5      #   car height band
# v1.9 (stage-build --visuals-canopies apex): clip kept the low side of tilted cones at full radius (up to 3.9 m wide
# orange panels); apex scales the whole cone toward its apex until it is under the cut and at most this wide in plan
canopy_max_span_m = 1.5
shape_min_fill = 0.8            # offline check: drawn shape bounds / collider bounds per axis (prisms and capsule tips
                                #   are inscribed; short tilted capsules fill ~0.84)

[vegetation]
foliage_material = "masked" # masked | speedtree (experimental)
# Preserve existing lighting until compared on stage data. Spherical changes only real foliage shading:
# outward normals from the template's foliage bounds centre, shared across leaf materials and retained at mid LOD.
# Trunks, object boxes, far billboard cards and collision are unchanged. Includes procedural and instanced trees.
foliage_normals = "spherical" # original | spherical (original = rebuilt procedural / authored instanced)
foliage_normal_maps = true   # masked real-tree leaves: false uses flat tangent-space normals; speedtree already uses flat
# Object COLOR_0 and separate AO/lightmap textures are not multiplied into albedo by this converter.
# For darkness painted into a diffuse, [albedo_compensation] supports per-texture linear gains (neutral = 1).
# round 3: trees whose origin is within near_m of the centreline are drawn with their real LOD0 mesh (foliage_trunk opaque, foliage
# cut-out two-sided with its normal map) instead of cards + trunk stub, nearest first until near_max_triangles are used (budget);
# farther trees keep the cards and a thin species-bark stub
near_m = 12
fit_tree_colliders = 1   # fit the physics capsule of every tree with a real DR2 mesh (full, middle tier or card + stub; old key fit_real_tree_colliders still read) to its real trunk (ColliderFit): thin stub, no thick proxy hull; 0 = DR2 capsules; trees the fit leaves over [instancing] collider_gap_limit_cm keep theirs
near_max_triangles = 100000000
# round 3b, the middle tier: trees within mid_m that did not fit near_max_triangles are drawn with the same DR2 mesh, foliage thinned
# to mid_ratio of its leaf cards (kept cards enlarged to keep the cover; trunk kept whole), nearest first until mid_max_triangles;
# farther trees keep the cards and trunk stub. mid_m = 0: off
mid_m = 25
mid_ratio = 0.25
mid_min_triangles = 24
mid_max_triangles = 100000000
bush_max_triangles = 100000000   # bushes (soft vegetation) within mid_m: thinned DR2 mesh from this separate budget, nearest first (0 = cards only)
# triangles of a near tree reaching into the road corridor (any surface) beyond the objects' limits are left out first: of the budget about
# three quarters is drawn (Fi: 48 trees, 65k triangles of 90k)
card_brightness = 1.15          # far-tree cards: DR2's billboard strips read dark next to the real foliage; colour factor (1 = as DR2)
card_dilate_px = 12             #   colour of the opaque texels is spread this far into the transparent ones (no dark fringes)
card_material = "leaf"           #   leaf | masked: far-tree cards with the foliage leaf MIC (light through the leaves, flat normal); masked = props material + DR2 billboard normals (near black in game)
card_normals = "up"             #   up | face: card normals tilted to the sky, one copy per side (face = horizontal card normal, dark under a high sun)

[object_materials]
# flat colours (SurfaceColor of each MI): trunks orange, wood yellow, metal violet (posts stay magenta), concrete blue,
# rock cyan, plastic bright green, other (cars) black, soft (tree crowns in crowns mode only) dark green
trunks = "/Game/Data/Gameplay/PhysicalMaterials/MI_WallHayBale"
wood = "/Game/Data/Gameplay/PhysicalMaterials/MI_WallWood"
metal = "/Game/Data/Gameplay/PhysicalMaterials/MI_WallCloth"
concrete = "/Game/Data/Gameplay/PhysicalMaterials/MI_WallConcrete"
rock = "/Game/Data/Gameplay/PhysicalMaterials/MI_WallRock"
plastic = "/Game/Data/Gameplay/PhysicalMaterials/MI_WallPlastic"
other = "/Game/Data/Gameplay/PhysicalMaterials/MI_WallBasic"
soft = "/Game/Data/Gameplay/PhysicalMaterials/MI_WallBush"

[object_textures]
# only with --visuals-dr2 (objects not reverted): the class sections above (trunks, collider-shape proxies, crowns) and the
# edge posts get a texture of the stage itself instead of the flat colour. Per class: the object diffuse (any shader) most used
# by objects.materials.json whose DDS name contains one of the keywords, else the first stage "_d" texture with one; a class
# with no match keeps its flat colour (the report's dr2.class_textures lists the picks). Transparent texels (foliage cards)
# are set to the mean opaque colour, since M_Simple is opaque. UVs are box-projected, one repeat every repeat_m.
# DR2 tree textures end in _tr_d (trunk) and _fo_d (foliage), e.g. fin_birch_full_01_a_tr_d, fin_dougfir_full_01_b_fo_d
trunks = ["_tr_d", "bark", "trunk"]
wood = ["wood", "plank", "timber"]
metal = ["metal", "armco", "steel"]
concrete = ["concrete"]
rock = ["rock", "cliff", "boulder", "stone"]
plastic = ["plastic", "barrel"]
other = []
soft = ["_fo_d", "leaf", "leaves", "foliage", "canopy", "needle", "branch"]
posts = ["wood", "trunks", "concrete", "metal", "rock"]   # edge posts: the first class with a stage texture, else the road
                                                          #   texture ([] keeps [materials] posts); per-face 0..1 UVs
repeat_m = 2
fallback = ["concrete", "rock", "wood", "metal", "trunks"]   # a class without a stage texture takes the first of these that
                                                              #   has one, else the road texture (no debug colours)
# [across, up] for one class: DR2 bark is a tall strip (e.g. 512 x 2048) that wraps once around a ~30-40 cm trunk, so a
# 2 m square repeat smeared a sliver of it across each 6-sided trunk face (in-game test, Finland)
trunks_repeat_m = [1, 4]
# round 1: classes with no stage texture of their own that take a flat neutral colour instead of the fallback above (the fallback
# gave buildings and walls drawn from their colliders the mossy rock). rock stays on its rock texture.
neutral_classes = ["other", "concrete"]
neutral_colour = [150, 148, 142]   # concrete / plaster grey

[vista]
# only with stage-build --visuals-vista 1 (build.ps1 v1.6+): DR2's distant vista ring (render/vista.glb, the NONLOD_i_j
# meshes, ~10 km), drawn once the Hafren scenery is hidden so the horizon is not empty
material = ""                   # engine default, like the terrain
exclude_cell_m = 100            # collision ground only: vista triangles over a grid cell touched by the drawn ground are dropped
sink_cm = 200                   # render ground: a vista triangle is dropped when its centroid is over drawn ground or it touches
                                #   the road (21 points); the rest is sunk this much so it meets the drawn ground's edge (no margin)
min_distance_m = 50             # offline check: nearest vista vertex to the DR2 centreline (plan; DR2's own ring
                                #   comes to ~83 m on nz01r5)

[ground]
preserve_near_m = 60 # 0 restores previous terrain simplification
# only with stage-build --visuals-ground render (build.ps1 v1.10): the terrain section is DR2's render terrain
# (render/terrain.glb) instead of its collision ground, which covers only a ribbon along the road (acr-ref
# terrain-compare: 43% of the ground within 60 m of the nz01r5 centreline has no collision triangle)
road_mask_cm = 50               # render triangles with vertices, edge midpoints and centre over collision road cells are under the road
road_skirt_out_cm = 40          # shoulder along the road's open edges (AddSkirt): this far out ...
road_skirt_down_cm = 60         # ... and down, covering the cracks between the road and the ground beside it
terrain_skirt_out_cm = 20       # the same from the ground's open edges (road cut, outer boundary): out ...
terrain_skirt_down_cm = 150     # ... and down
gap_fill_radius_m = 500          # last-resort ground (BuildGapFill) where nothing is drawn within this of the route ...
gap_fill_cell_m = 8              # ... in cells this size ...
gap_fill_sink_cm = 50            # ... sunk this much below the surrounding drawn surfaces
# v1.12: render triangles steeper than this whose three DR2 layers are one texture-array slice (rock banks; Argentina
# 01 r3: 12% of the ground triangles, slices 8-11) are drawn on that slice with box UVs instead of the top-down ground
# bake, which smears a few texels down each face. 0 = off.
steep_rock_deg = 30
hole_fill_max_m = 60         # open edge loops in the ground mesh shorter than this (perimeter) are filled (FillHoles)
under_road_sink_cm = 20        # ... and are kept this far below it (0 = dropped): the mask reaches up to a cell past the road
                                #   edge, and dropped triangles left open slivers along the road (holes seen in game)
low_fill_sink_cm = 50           # DR2 low-LOD fill (BuildLowFill) below the detail ground where they overlap
fill_cell_cm = 100              # collision ground triangles whose centre is over no render terrain are drawn as a fill
road_lift_cm = 2                # road section raised against z-fighting where the coplanar render terrain meets it
hole_check_m = 60               # offline check: plan samples every 2 m within this of the centreline over drawn ground
# only with --visuals-ground-lod 1 (build.ps1 v1.11): quadric edge collapse of the render terrain; no original plane
# moves more than the tolerance, piecewise linear in the distance from the route (constant beyond the last point).
# Border vertices (mesh edge, the cut along the road section) never move.
simplify_distance_m = [10, 30, 60, 150, 300, 600]
simplify_tolerance_cm = [2, 5, 10, 25, 60, 150]

[textured]
# only with stage-build --visuals-textured 1 (build.ps1 v1.7+): Hafren's own lit materials on the ground sections
# (the v1.3 tex-proof showed both render on the visuals mesh with the right look). Objects keep their flat colours.
terrain = "/Game/Environments/WalesS4HafrenSouth/TerrainMaterialInstances/MI_Terrain9MatBlend1001"
road = "/Game/Environments/WalesS4HafrenSouth/GravelMaterial/MI_WalesS4HafrenSouthGravelRoad1"
vista = "/Game/Environments/WalesS4HafrenSouth/TerrainMaterialInstances/MI_Terrain9MatBlend1001"
terrain_uv_m = 4                # terrain UV0 = world plan position / this (as in the tex-proof)
vista_uv_m = 40                 # coarser on the distant ring
# road UVs in the layout of Hafren's road meshes (acr-ref mesh-uv SM_WalesS4HafrenSouthTrack0104_Road_0: UV0 2.02 m
# across x 3.59 m along per unit, UV1 0..1 edge to edge x 7.17 m, UV2/UV4 trajectory 5.5 m x 100 m)
road_uv0_across_m = 2.0
road_uv0_along_m = 3.6
road_uv1_along_m = 7.2
road_traj_across_m = 5.5
road_traj_along_m = 100
road_color = [0, 128, 0, 10]    # RGBA vertex colour; Hafren's road vertices are R ~0, G 128, B 0, A mostly < 20
road_follow_max_m = 15          # road-surface triangles further from the DR2 centreline (side roads) get world-planar UVs
road_stretch_min_fraction = 0.95  # offline check: road triangles whose UV0 scale is within 1.5x of nominal

[dr2_textures]
# only with stage-build --visuals-dr2 1 (build.ps1 v1.8, on top of [textured]): DR2's own textures (dr2-extract
# stage-textures -> work/ir/<stage>/textures) as new Texture2D + MaterialInstanceConstant packages under package_root.
# --visuals-dr2-revert terrain,road,vista,objects (build.ps1 -Dr2Revert) keeps those sections on their v1.7 material.
package_root = "/Game/AcrXs/Dr2Tex/nz01r5"
# templates (acr-ref tex-scan / mic-scan): NeverStream, every mip inline in the export, not virtual
texture_template = "/Game/Materials/PhotoMode/Textures/T_Dirt"        # sRGB, PF_DXT1 4096x2048, 13 mips
linear_template = "/Game/Effects/Vehicles/Skid/T_SkidDebug_N"          # linear (flat ORM, flat normal)
mic_template = "/Game/Environments/MonteCarloS2Sisteron/TileableMaterials/MI_SisteronConcrete01"   # parent M_Simple
mic_base_texture = "T_ConcreteWalkway_C"      # the template's Simple_BaseColor_Texture
mic_orm_texture = "T_ConcreteWalkway_L"       #   Simple_OcclRoughMet_Texture -> flat orm
mic_normal_texture = "T_ConcreteWalkway_N"    #   Simple_Normal_Texture -> flat (BC5 128, 128)
orm = [255, 217, 0]             # occlusion 1, roughness 0.85, metal 0 (ACR _L textures: R occlusion, G roughness, B metal)
# ground bake tiles: the bake (base colour) plus DR2's ground normal map tiled as M_Simple's detail normal, for close-up
# relief the 6-8 cm/px bake cannot carry. Template: an M_Simple child with base colour, normal and detail normal switched on.
detail_mic_template = "/Game/Props/MonteCarloProps/MOnBolStoneWallB/MI_MonBolStoneWallC"
detail_mic_base_texture = "T_MonBolStoneWallC_B"
detail_mic_orm_texture = "T_MonBolStoneWallC_L"
detail_mic_normal_texture = "T_MonBolStoneWallC_N"
detail_mic_detail_texture = "T_xgixbbt_2K_N"     # Simple_Normal_Texture_Detail (and _Global)
detail_mic_tiling = 10                            # the template's DetailNormalTiling (repeats per UV unit), replaced per tile
detail_mic_strength = 3                           # the template's DetailNormalStrength, replaced by ground_detail_strength
# object textures with transparent texels (wire fences, nets, cut-out signs): M_MasterMaskedSurfaces (masked, two-sided,
# colour + opacity in one texture) instead of the opaque M_Simple, which drew the transparent parts black
leaf_mic_template = "/Game/Foliage/Trees/SpruceWales/MI_SpruceWales06LeafMat"
leaf_mic_base_texture = "T_SpruceWalesLeaf_B"
leaf_mic_normal_texture = "T_SpruceWalesLeaf_N"
leaf_mic_subsurface_texture = "T_SpruceWalesLeaf_SS"
masked_mic_template = "/Game/Props/AlsaceBuildings/FraChaBldWarehouseA/MI_FraChaBldWarehouseAProps04_OP"
masked_mic_base_texture = "T_FraChaBldWarehouseAProps04_B"     # Texture Color/Opacity
masked_mic_orm_texture = "T_FraChaBldWarehouseAProps04_L"
masked_mic_normal_texture = "T_FraChaBldWarehouseAProps04_N"
object_normal_max_size = 1024                     # objects and class sections get their DR2 normal map (BC5) up to this size
proc_tangents = "uv"             # uv = derive missing tangents from UV0; normal = legacy normal-only basis
object_normal_maps = false       # Keep flat until UV tangents + DR2 normals pass offline and in-game checks
masked_min_transparent = 0.05                    # share of texels with alpha < 0.5 above which a texture is drawn masked
ground_detail_m = 1.5                             # one detail-normal repeat every this many metres
ground_detail_strength = 1.5
# round 1: the road bake tiles (their own detail scale, strength and ORM; the terrain keeps ground_detail_*)
road_detail_mode = "blended" # legacy: original single sample; blended: rotated second sample
road_detail_m = 2.5
# The paired road normal is a full road layer on DR2 road-aligned UVs, not a micro-detail.
# Disable its world-planar repetition over the baked road; opt in with a nonzero strength.
road_detail_strength = 1.0
road_orm = [255, 178, 0]        # occlusion 1, roughness 0.7, metal 0
max_size = 2048                 # mips larger than this are dropped
# DR2's terrain colour maps (nz_01_a_0x_d, section_b) are grey-centred tints over a 17-slice detail array blended per
# vertex; M_Simple takes one texture, so the ground uses array slices as tiling textures
terrain = "nz_ral_set_1_01_d1049518591_slice4"   # grass
terrain_tile_m = 8                                # DR2's detail UV1 on the terrain is ~8 m per unit
road = "nz_ral_set_1_01_d1049518591_slice2"      # road strip: gravel with grass verges, edge to edge across U
# vista: large colour map (tint) x 2 over the three layers' mean colours mixed by the blend map, baked
vista_colour_map = "nz_ral_master_vista_cm"
vista_blend_map = "nz_ral_master_vista_mk"
vista_layers = ["nz_ral_vista_grass_d", "nz_ral_vista_road_d", "nz_ral_vista_forest_d"]
vista_size = 2048
# objects: render-mesh instances by DR2 material (TDiffuse*); these shaders are alpha-tested or blended (no masked
# parent: M_Simple is opaque), their triangles keep the class colour
object_skip_material_kinds = ["ground_ao", "shadow"] # Exclude helper geometry from every mesh path.
object_skip_shaders = ["foliage", "decal", "blend", "glass", "water", "shadow", "ground_ao"]

[checks]
# Offline checks tuned on New Zealand that measure how closely the drawn ground / decoration follows DR2's collision mesh. On rocky
# stages (cliffs and rocks have collision but are drawn as objects) and where DR2's terrain has gaps they fail without a real
# defect; a failing check matching one of these regexes prints WARN (and is listed in the batch report) instead of failing the build.
advisory = ["^visuals road corridor: posts", "^visuals: vista section last", "^visuals: terrain box UVs", "^visuals: \d+ triangles in total", "^visuals road corridor: objects:(trunks|bark:)", "^visuals ground: road vertices", "^visuals ground: drawn ground vs collision ground", "^visuals ground: \d+ plan samples", "^ground raycast at \d+ gate crossings", "^added simple entries: \d+ with their centre over the road surface"]

[invisible]
# acr-ref stage-build / stage-check (InvisibleCheck.cs): physics against visuals as height maps around the route. A cell
# where a DR2 collider (ground, object mesh, box, capsule) stands more than tolerance_m above everything drawn at car
# height (band_m above the drawn ground) is an invisible obstacle; clusters of min_area_m2+ within drive_m of the
# centreline fail the build (2026-11-01: the car stopped at nothing on open ground beside the road, Argentina 01 r3).
radius_m = 25
cell_m = 0.5
tolerance_m = 0.3
band_m = 2.5
drive_m = 12
min_area_m2 = 0.5

[ornaments]
# round 2b: DR2's ornament rocks (stage.json "ornaments", stage-ir --ornament-*; render/ornaments.glb), drawn as visuals only (their
# collision is already in DR2's ground / object colliders), before the physics fill so that only fills what the rocks do not cover
enabled = 1
max_distance_m = 30      # plan distance of an instance from the centreline; farther rocks are not drawn
decimate_ratio = 0.25    # each prototype is simplified once (quadric collapse, UV seams locked) to this share of its triangles
min_triangles = 40       # prototypes (per material) at or below this are not simplified, and never below it

[instancing]
# Instanced DR2 trees (docs/instancing-plan.md; needs --visuals-dr2): every DR2 tree template of the stage (render/objects.glb; solid tree
# colliders, sSolidTree* / sSolidPalm*; not fences, stumps or logs) is written as a cooked StaticMesh package, and ALL its placements as
# HierarchicalInstancedStaticMeshComponents (NoCollision, one per template per chunk_m cell) in both gameplay cells. Such a tree gets no
# card, no trunk stub, no proxy hull and no merged "tree:" mesh; its DR2 collider is unchanged. Only the DR2 stages listed in `stages`
# are affected (matched against the forward route id); 0 = off everywhere. A template with no usable DR2 trunk or foliage material
# keeps its cards and trunk stub (reported).
enabled = 1
stages = []   # off: instanced trees do not render in game yet (docs/instancing-bug-brief.md)
mesh_template = "/Game/Foliage/Trees/SpruceWales/SM_SpruceWales06"   # cooked ACR tree mesh cloned for every species (extracted like the other legacy templates)
chunk_m = 200            # one component per template per chunk_m x chunk_m cell, so the engine culls whole chunks
billboard = 1            # a far LOD: DR2 own billboard strip as two crossed cards (MaskedMic), when the template has one
billboard_screen_size = 0.2   # the billboard LOD is used below this screen size
collider_gap_limit_cm = 25   # build check: collider and real trunk at 0.3 / 1.0 m (both ways) and 2.0 m (collider beyond trunk) above the base of every instanced tree within 12 m of the road, at most this far apart; trees the fit lists (kept DR2 capsule, or fitted but still over: multi-stem or forked) are exempt

[stage]
finish_runout_m = 60


# Exact texture names as logged by Dr2Materials; linear RGB gain, 1 = unchanged.
# Opt-in experiment: set a selected baked tile to 1.5, then compare shaded banks.
[albedo_compensation]
