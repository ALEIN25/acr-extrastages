# Stage variants: a DR2 route and its reverse built into one level (docs/variants-plan.md; stage-build --reverse-ir).
# Read by acr-ref stage-build --variants; kept apart from scenery.toml so pairs do not change the inputs of single stages.

[reverse]
# The reverse gameplay cell 7FF9 keeps only gameplay_layer; every other cell goes to hidden_layer alone, and the GameConfigurator's
# FullReverse entry loads configurator_to in place of configurator_from (hidden_layer's asset), so the reverse variant
# streams its own gameplay cell and nothing of Hafren. The registry's reverse variant row lists only that layer too.
gameplay_layer = "DataLayer_B42F85194792839167406C971316902E"
configurator_from = "DL_HafrenSouthFullReverseRallyProps"
configurator_to = "DL_HafrenSouthFullReverseGameplayActors"

[pairs]
# A route and its reverse built into one stage container: one track, variants Forward (the key) and Reverse (the value).
# Off by default until the reverse variant is checked in game; with enabled = true the launcher builds a pair under the
# forward stage's id when both stages fit, and the reverse stage is no longer built on its own.
# Every DR2 rally area has 3 pairs (route 0 + 1 full road, 2 + 5 and 3 + 4 the halves); each listed pair runs on the same
# road in opposite directions (>= 85% of the reverse within 30 m of the forward road; work/layouts, 2026-11-01).
enabled = true
# only = "<forward dr2 id>, ...": pair just these (an in-game test without turning every selected stage into a pair)
# only = "argentina_rally_01_route_3"
argentina_rally_01_route_0 = "argentina_rally_01_route_1"
